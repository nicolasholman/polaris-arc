# Envio Cloud's free plan deletes a deployment that serves no request for 7
# days. Once the CRE cron stops querying it (after judging starts), this keeps
# the endpoint alive with one `_meta` query a day. Set the repository variable
# POLARIS_INDEXER_URL to the `envio-cloud deployment endpoint` URL; without it
# the job does nothing.
name: indexer keep-alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query _meta
        env:
          URL: ${{ vars.POLARIS_INDEXER_URL }}
        run: |
          if [ -z "$URL" ]; then echo "POLARIS_INDEXER_URL is not set; nothing to keep alive."; exit 0; fi
          curl -fsS -X POST "$URL" -H 'content-type: application/json' \
            -d '{"query":"{ _meta { chainId progressBlock isReady } }"}'

    # The first Polaris deploy block. ENVIO_START_BLOCK overrides it.
    start_block: ${ENVIO_START_BLOCK:-66288120}
    # Two blocks (800 ms) is Monad finality, so a webhook never fires for a
    # block that later reorgs. ENVIO_BLOCK_LAG=0 for the lowest latency.
    block_lag: ${ENVIO_BLOCK_LAG:-2}

# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# GENERATED by scripts/generate.mjs from packages/contracts/abi and
# ../contracts/deployments/monad-testnet.json. Edit the script, not this file.
name: polaris-indexer
description: Polaris on Monad. Payments, Pay in 4 plans, subscriptions, sends, payouts, credit and CRE collections, for the dashboard, webhooks and the CRE collections workflow.
schema: ./schema.graphql
handlers: ./src/handlers
# Every address the indexer surfaces is lowercase, so GraphQL `_eq` filters
# work on addresses as clients hold them after `.toLowerCase()`.
address_format: lowercase
# Rows are per chain, keyed (id, chainId): mainnet can join later.
disable_default_cross_chain: true
field_selection:
  transaction_fields:
    - hash
    - from # who paid the gas: the Privy relayer, the CRE transmitter; never a user
    - to # a payout is a transfer sent to the stablecoin itself, not a Polaris contract
contracts:
  - name: ScoreManager
    events:
      - event: "CollateralVaultSet(address indexed vault)"
      - event: "DeclinedForDefaults(address indexed user, uint32 liquidations)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "RequireUnderwritingSet(bool required)"
      - event: "ScoreChanged(address indexed user, uint16 oldScore, uint16 newScore, string reason)"
      - event: "UnderwriterSet(address indexed underwriter, bool allowed)"
      - event: "Underwritten(address indexed user, uint16 score, bool declined, uint64 observedAt)"
      - event: "WriterSet(address indexed writer, bool allowed)"
  - name: PolarisLoanEngine
    events:
      - event: "CollateralVaultSet(address indexed vault)"
      - event: "InstallmentCollected(uint256 indexed loanId, address indexed caller, uint256 amount)"
      - event: "InstallmentPaid(uint256 indexed loanId, address indexed borrower, uint32 installmentIndex, uint256 amount, bool onTime)"
      - event: "LiquidityWithdrawn(address indexed to, uint256 amount)"
      - event: "LoanCreated(uint256 indexed loanId, address indexed borrower, address indexed merchant, uint256 principal, uint256 totalOwed, uint32 installments)"
      - event: "LoanFullyRepaid(uint256 indexed loanId, address indexed borrower)"
      - event: "LoanLiquidated(uint256 indexed loanId, address indexed borrower, uint256 outstanding, uint256 recovered)"
      - event: "MerchantRegistrySet(address indexed registry)"
      - event: "NonceInvalidated(address indexed borrower, uint256 nonce)"
      - event: "OnTimeBonusWithheld(uint256 indexed loanId, address indexed borrower)"
      - event: "OriginatorSet(address indexed originator, bool allowed)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "TreasuryChanged(address indexed treasury)"
  - name: PolarisPayments
    events:
      - event: "ChargeMissed(uint256 indexed subId, uint32 misses, string reason)"
      - event: "CheckoutSet(address indexed checkout)"
      - event: "FeeChanged(uint256 bps)"
      - event: "OperatorSet(address indexed operator, bool allowed)"
      - event: "OrderQuoted(bytes32 indexed paymentId, address indexed merchant, uint256 amount)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "PaymentMade(bytes32 indexed paymentId, address indexed payer, address indexed merchant, uint256 amount, uint256 fee, string orderId)"
      - event: "PlanCreated(uint256 indexed planId, address indexed merchant, uint256 price, uint64 period)"
      - event: "PlanDeactivated(uint256 indexed planId)"
      - event: "Subscribed(uint256 indexed subId, uint256 indexed planId, address indexed subscriber)"
      - event: "SubscriptionCancelled(uint256 indexed subId, address indexed by)"
      - event: "SubscriptionCharged(uint256 indexed subId, uint256 amount, uint256 fee, uint32 period)"
      - event: "SubscriptionLapsed(uint256 indexed subId, uint32 misses)"
  - name: MerchantRegistry
    events:
      - event: "MerchantActivated(address indexed merchant, bool active)"
      - event: "MerchantRegistered(address indexed merchant, string name, address payoutAddress)"
      - event: "MerchantRegisteredBy(address indexed merchant, address indexed operator)"
      - event: "MerchantUpdated(address indexed merchant, address payoutAddress, uint128 maxOrderValue)"
      - event: "NonceInvalidated(address indexed merchant, uint256 nonce)"
      - event: "OperatorSet(address indexed operator, bool allowed)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "SettlementRecorded(address indexed merchant, uint256 amount)"
  - name: CollateralVault
    events:
      - event: "CollateralLocked(address indexed user, uint256 amount, uint256 newTotal)"
      - event: "CollateralSeized(address indexed user, uint256 amount, address indexed to)"
      - event: "CollateralWithdrawn(address indexed user, uint256 amount, uint256 newTotal)"
      - event: "LoanEngineSet(address indexed engine)"
      - event: "MultiplierChanged(uint256 bps)"
      - event: "NonceInvalidated(address indexed borrower, uint256 nonce)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "SeizerSet(address indexed seizer, bool allowed)"
  - name: BatchSettlement
    events:
      - event: "BatchSettled(bytes32 indexed batchId, uint256 recipients, uint256 totalAmount, address indexed settler)"
      - event: "Funded(address indexed from, uint256 amount)"
      - event: "MerchantPaid(bytes32 indexed batchId, address indexed merchant, uint256 amount, bytes32 indexed memo)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "SettlerSet(address indexed settler, bool allowed)"
  - name: PolarisSend
    events:
      - event: "Cancelled(address indexed linkKey, address indexed sender, uint256 amount)"
      - event: "Claimed(address indexed linkKey, address indexed to, uint256 amount)"
      - event: "Refunded(address indexed linkKey, address indexed sender, uint256 amount)"
      - event: "Sent(address indexed linkKey, address indexed sender, uint256 amount, uint64 expiresAt)"
  - name: PolarisCheckout
    events:
      - event: "CheckoutPaid(bytes32 indexed orderKey, address indexed merchant, address indexed buyer, string orderId, uint256 amount, uint256 fee)"
      - event: "CreditGuardianSet(address indexed guardian)"
      - event: "NonceInvalidated(address indexed buyer, uint256 nonce)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "Paused(address account)"
      - event: "PlanOpened(bytes32 indexed orderKey, address indexed merchant, address indexed buyer, uint256 loanId, string orderId, uint256 principal, uint256 totalOwed, uint32 installments, uint64 interval, uint64 firstDueAt)"
      - event: "Reauthorized(address indexed buyer, uint256 value, uint256 deadline)"
      - event: "SubscriptionStarted(bytes32 indexed orderKey, address indexed merchant, address indexed buyer, uint256 subId, uint256 planId, string orderId, uint256 pricePerPeriod, uint64 periodSeconds, uint64 nextChargeAt)"
      - event: "Unpaused(address account)"
  - name: CollectionsReceiver
    events:
      - event: "CollectionsRun(uint256 tasks, uint256 executed, uint256 skipped)"
      - event: "ExpectedAuthorUpdated(address indexed previousAuthor, address indexed newAuthor)"
      - event: "ExpectedWorkflowIdUpdated(bytes32 indexed previousId, bytes32 indexed newId)"
      - event: "ExpectedWorkflowNameUpdated(bytes10 indexed previousName, bytes10 indexed newName)"
      - event: "ForwarderAddressUpdated(address indexed previousForwarder, address indexed newForwarder)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "SecurityWarning(string message)"
      - event: "SimulationTransmitterSet(address indexed transmitter)"
      - event: "TaskExecuted(uint8 indexed action, uint256 indexed id, uint256 amount)"
      - event: "TaskSkipped(uint8 indexed action, uint256 indexed id, bytes reason)"
  - name: UnderwritingReceiver
    events:
      - event: "ExpectedAuthorUpdated(address indexed previousAuthor, address indexed newAuthor)"
      - event: "ExpectedWorkflowIdUpdated(bytes32 indexed previousId, bytes32 indexed newId)"
      - event: "ExpectedWorkflowNameUpdated(bytes10 indexed previousName, bytes10 indexed newName)"
      - event: "ForwarderAddressUpdated(address indexed previousForwarder, address indexed newForwarder)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "SecurityWarning(string message)"
      - event: "SimulationTransmitterSet(address indexed transmitter)"
      - event: "UnderwritingApplied(address indexed user, address indexed linkedWallet, uint16 score)"
      - event: "UnderwritingRefused(address indexed user, address indexed linkedWallet, bytes reason)"
  - name: CreForwarder
    events:
      - event: "ReportProcessed(address indexed receiver, bytes32 indexed workflowExecutionId, bytes2 indexed reportId, bool result)"
  - name: MerchantWallet
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
chains:
